{% extends 'base.html' %}

{% block title %}Image Upload{% endblock %}

{% block content %}
    <h1>Upload Image for {{ recipe.name }}</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload Image</button>
    </form> 

    <a href="{% url 'ledger:recipe_detail' recipe.pk %}">Back to Recipe</a>
{% endblock %}
