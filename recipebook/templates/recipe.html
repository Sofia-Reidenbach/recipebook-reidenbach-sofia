{% extends 'base.html' %}
<head>
    {% block title %}Recipe Book{% endblock %}
</head>
<body>
    {% block content %}
        <p>{{recipe.name}}</p>
        <ul>
            {% for item in recipe.ingredients.all %}
            <li>{{ item.ingredient.name }}: {{ item.quantity }}</li>
            {% endfor %}
        </ul>
    {% endblock %}
</body>
